services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
  database:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on:
      mongo:
        condition: service_healthy
  sentiment:
    build: ./server/djangoapp/microservices
  web:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DB_PATH: /data/db.sqlite3
      backend_url: http://database:3030
      sentiment_analyzer_url: http://sentiment:5050
    volumes:
      - django-data:/data
    depends_on:
      - database
      - sentiment
volumes:
  mongo-data:
  django-data:
